name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Deployment reason (audit trail)"
        required: true
        type: string
      execution_scope:
        description: "Maximum authorized workflow boundary"
        required: true
        default: archive-only
        type: choice
        options:
          - archive-only
          - remote-dry-run
          - artifact-stage-only
          - deploy
      resume_transfer:
        description: "Explicitly reuse immutable COS objects after a failed stage"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  provenance:
    name: Verify exact main provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Verify workflow SHA is the exact origin main tip
        run: |
          remote_output=$(git ls-remote --exit-code origin refs/heads/main)
          remote_main=$(printf '%s\n' "$remote_output" | awk '$2 == "refs/heads/main" {print $1}')
          count=$(printf '%s\n' "$remote_output" | awk '$2 == "refs/heads/main" {count += 1} END {print count + 0}')
          test "$count" = "1"
          test "$remote_main" = "${{ github.sha }}"

  preflight:
    name: Preflight (lint + test + build)
    needs: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          cache: "pip"

      - name: Install uv
        run: python -m pip install uv==0.11.32

      - name: Set up Node.js for OpenAPI type drift guard
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            web/package-lock.json
            rendering/package-lock.json

      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Install renderer test deps
        working-directory: rendering
        run: npm ci

      - name: Test renderer process boundary
        working-directory: rendering
        run: npm test

      - name: Type check renderer
        working-directory: rendering
        run: npm exec tsc -- --noEmit

      - name: Install Python deps
        run: uv sync --locked --extra dev

      - name: Check semantic version projections
        run: uv run --locked python scripts/project_version.py --check

      - name: Lint
        run: uv run --locked --extra dev ruff check src tests scripts --output-format=github

      - name: Type check
        run: make typecheck

      - name: Test
        run: uv run --locked --extra dev python -m pytest tests/ --tb=short -q --timeout=60
        env:
          API_KEY: "test-api-key-for-pytest"
          OPENAI_API_KEY: "sk-test"
          ANTHROPIC_API_KEY: "sk-ant-test"
          DEEPSEEK_API_KEY: ""
          POYO_API_KEY: ""
          SEEDANCE_API_KEY: ""
          SILICONFLOW_API_KEY: ""
          ELEVENLABS_API_KEY: ""
          TIKTOK_ACCESS_TOKEN: ""
          TIKTOK_PUBLISH_ENABLED: "false"
          SHOPIFY_STORE_URL: ""
          SHOPIFY_ACCESS_TOKEN: ""
          SHOPIFY_PUBLISH_ENABLED: "false"
          SUPABASE_URL: ""
          SUPABASE_SERVICE_KEY: ""

      - name: Frontend lint
        working-directory: web
        run: npx eslint src e2e playwright.ui.config.ts playwright.prod.config.ts

      - name: Frontend type check
        working-directory: web
        run: npx tsc --noEmit -p tsconfig.json

      - name: Frontend test
        working-directory: web
        run: npm test -- --run

      - name: Frontend build
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_IS_DEMO: "true"

      - name: Docker compose config validation (no start)
        run: |
          : > .env
          docker compose -f docker-compose.yml config --quiet
          AI_VIDEO_SHARED_ROOT=/tmp/ai-video-shared AI_VIDEO_ENV_FILE=/dev/null \
            PORTAL_AUTH_ENV_FILE=/dev/null RELEASE_SOURCE_SHA=${{ github.sha }} \
            APP_VERSION=$(python scripts/project_version.py --check) \
            RELEASE_IMAGE_TAG=${{ github.sha }} \
            docker compose -f deploy/lighthouse/docker-compose.release.yml config --quiet

      - name: Verify local-only artifacts are excluded from release sync
        run: |
          for pattern in .superpowers .kiro tmp '*.pem' '*.sqlite3' '.env'; do
            grep -Fx -- "$pattern" deploy/lighthouse/rsync-excludes.txt >/dev/null
          done

  build-images:
    name: Build + inspect release images
    needs: [provenance, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_artifact_id: ${{ steps.release-bundle.outputs.artifact-id }}
      release_artifact_digest: ${{ steps.release-bundle.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Read semantic version
        id: project-version
        run: echo "value=$(python3 scripts/project_version.py --check)" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          load: true
          tags: lighthouse-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          build-args: |
            RELEASE_SOURCE_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.project-version.outputs.value }}
            APT_MIRROR=deb.debian.org
            PIP_INDEX_URL=https://pypi.org/simple/

      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          load: true
          tags: lighthouse-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            RELEASE_SOURCE_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.project-version.outputs.value }}
            NEXT_PUBLIC_API_BASE_URL=/api
            NEXT_PUBLIC_IS_DEMO=false
            NEXT_PUBLIC_API_KEY=

      - name: Build rendering image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./rendering/Dockerfile
          push: false
          load: true
          tags: lighthouse-rendering:${{ github.sha }}
          cache-from: type=gha,scope=rendering
          cache-to: type=gha,mode=max,scope=rendering
          build-args: |
            RELEASE_SOURCE_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.project-version.outputs.value }}
            APT_MIRROR=deb.debian.org

      - name: Verify release image revision labels, semantic versions and backend runtime config
        run: |
          for image in \
            lighthouse-backend:${{ github.sha }} \
            lighthouse-frontend:${{ github.sha }} \
            lighthouse-rendering:${{ github.sha }}; do
            revision=$(docker image inspect \
              --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' \
              "$image")
            test "$revision" = "${{ github.sha }}"
            version=$(docker image inspect \
              --format='{{index .Config.Labels "org.opencontainers.image.version"}}' \
              "$image")
            test "$version" = "${{ steps.project-version.outputs.value }}"
          done
          docker run --rm --network none --entrypoint python3 \
            -e ENVIRONMENT=production \
            -e API_KEY=release-image-import-smoke-only \
            -e MEDIA_SIGN_SECRET=release-image-import-smoke-secret-32bytes \
            lighthouse-backend:${{ github.sha }} -c \
            'from pathlib import Path; from src.services.provider_price_catalog import ProviderPriceCatalog; assert Path("/app/configs/provider-cost-catalog.v1.json").is_file(); ProviderPriceCatalog.load_default(); import src.api'

      - name: Smoke exact frontend and rendering image runtimes
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker rm -f release-smoke-frontend release-smoke-rendering >/dev/null 2>&1 || true
            docker network rm release-smoke >/dev/null 2>&1 || true
            docker volume rm \
              release-smoke-renderer-output \
              release-smoke-renderer-socket >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create --internal release-smoke >/dev/null
          docker run -d --name release-smoke-frontend --network release-smoke \
            lighthouse-frontend:${{ github.sha }} >/dev/null
          docker run -d --name release-smoke-rendering \
            --init \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --cpus 2 \
            --memory 4g \
            --pids-limit 256 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m \
            --volume release-smoke-renderer-output:/app/output \
            --volume release-smoke-renderer-socket:/run/rendering \
            lighthouse-rendering:${{ github.sha }} >/dev/null
          for attempt in $(seq 1 30); do
            frontend_ok=0
            rendering_ok=0
            docker exec release-smoke-frontend wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 && frontend_ok=1
            docker exec release-smoke-rendering node /app/healthcheck.mjs \
              >/dev/null 2>&1 && rendering_ok=1
            if [ "$frontend_ok" = 1 ] && [ "$rendering_ok" = 1 ]; then
              exit 0
            fi
            [ "$attempt" = 30 ] || sleep 2
          done
          docker logs release-smoke-frontend >&2 || true
          docker logs release-smoke-rendering >&2 || true
          exit 1

      - name: Generate backend SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: lighthouse-backend:${{ github.sha }}
          format: spdx-json
          output-file: sbom-backend.spdx.json
          upload-artifact: false

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: lighthouse-frontend:${{ github.sha }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json
          upload-artifact: false

      - name: Generate rendering SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: lighthouse-rendering:${{ github.sha }}
          format: spdx-json
          output-file: sbom-rendering.spdx.json
          upload-artifact: false

      - name: Scan backend image
        id: scan-backend
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: lighthouse-backend:${{ github.sha }}
          # Backend ships FFmpeg but does not inherit renderer-only network isolation.
          config: .grype-backend.yaml
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: scan-backend.json

      - name: Scan frontend image
        id: scan-frontend
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: lighthouse-frontend:${{ github.sha }}
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: scan-frontend.json

      - name: Scan rendering image
        id: scan-rendering
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: lighthouse-rendering:${{ github.sha }}
          config: .grype-rendering.yaml
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: scan-rendering.json

      - name: Scan backend image with Trivy
        id: trivy-backend
        continue-on-error: true
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        env:
          # Backend ships FFmpeg but does not inherit renderer-only network isolation.
          TRIVY_IGNOREFILE: .trivyignore-backend.yaml
        with:
          version: v0.69.3
          image-ref: lighthouse-backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: trivy-backend.json
          exit-code: 1

      - name: Scan frontend image with Trivy
        id: trivy-frontend
        continue-on-error: true
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          version: v0.69.3
          image-ref: lighthouse-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: trivy-frontend.json
          exit-code: 1

      - name: Scan rendering image with Trivy
        id: trivy-rendering
        continue-on-error: true
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        env:
          TRIVY_IGNOREFILE: .trivyignore-rendering.yaml
        with:
          version: v0.69.3
          image-ref: lighthouse-rendering:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: trivy-rendering.json
          exit-code: 1

      - name: Verify vulnerability scan evidence is complete
        id: scan-evidence
        if: always()
        continue-on-error: true
        run: |
          for report in \
            scan-backend.json \
            scan-frontend.json \
            scan-rendering.json \
            trivy-backend.json \
            trivy-frontend.json \
            trivy-rendering.json; do
            test -s "$report"
            python3 -m json.tool "$report" >/dev/null
          done

      - name: Upload vulnerability scan evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vulnerability-scan-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            scan-backend.json
            scan-frontend.json
            scan-rendering.json
            trivy-backend.json
            trivy-frontend.json
            trivy-rendering.json

      - name: Enforce High/Critical vulnerability scan results
        if: always()
        env:
          BACKEND_GRYPE_OUTCOME: ${{ steps.scan-backend.outcome }}
          FRONTEND_GRYPE_OUTCOME: ${{ steps.scan-frontend.outcome }}
          RENDERING_GRYPE_OUTCOME: ${{ steps.scan-rendering.outcome }}
          BACKEND_TRIVY_OUTCOME: ${{ steps.trivy-backend.outcome }}
          FRONTEND_TRIVY_OUTCOME: ${{ steps.trivy-frontend.outcome }}
          RENDERING_TRIVY_OUTCOME: ${{ steps.trivy-rendering.outcome }}
          SCAN_EVIDENCE_OUTCOME: ${{ steps.scan-evidence.outcome }}
        run: |
          test "$BACKEND_GRYPE_OUTCOME" = success
          test "$FRONTEND_GRYPE_OUTCOME" = success
          test "$RENDERING_GRYPE_OUTCOME" = success
          test "$BACKEND_TRIVY_OUTCOME" = success
          test "$FRONTEND_TRIVY_OUTCOME" = success
          test "$RENDERING_TRIVY_OUTCOME" = success
          test "$SCAN_EVIDENCE_OUTCOME" = success

      - name: Package exact reviewed release images and digests
        run: |
          docker image inspect --format='{{.Id}}' \
            lighthouse-backend:${{ github.sha }} > image-digests.txt
          docker image inspect --format='{{.Id}}' \
            lighthouse-frontend:${{ github.sha }} >> image-digests.txt
          docker image inspect --format='{{.Id}}' \
            lighthouse-rendering:${{ github.sha }} >> image-digests.txt
          docker save \
            lighthouse-backend:${{ github.sha }} \
            lighthouse-frontend:${{ github.sha }} \
            lighthouse-rendering:${{ github.sha }} \
            | gzip -1 > release-images-${{ github.sha }}.tar.gz
          sha256sum release-images-${{ github.sha }}.tar.gz \
            > release-images-${{ github.sha }}.tar.gz.sha256

      - name: Upload reviewed release bundle
        id: release-bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-bundle-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release-images-${{ github.sha }}.tar.gz
            release-images-${{ github.sha }}.tar.gz.sha256
            image-digests.txt
            sbom-*.spdx.json
            scan-*.json
            trivy-*.json

  remote-dry-run:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.execution_scope == 'remote-dry-run' || inputs.execution_scope == 'artifact-stage-only' || inputs.execution_scope == 'deploy' }}
    name: Remote rsync dry-run evidence
    needs: [provenance, preflight, build-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production-read-only-dry-run
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build exact source manifest
        run: |
          python3 scripts/backup_manifest.py source-create \
            --root . \
            --git-sha ${{ github.sha }} \
            --output source-manifest.v1.json
          git ls-files -z > "$RUNNER_TEMP/release-files.zlist"
          printf '%s\0' "source-manifest.v1.json" >> "$RUNNER_TEMP/release-files.zlist"
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            case "$pattern" in
              ""|\#*) continue ;;
            esac
            printf '%s\0' "$pattern"
          done < deploy/lighthouse/rsync-excludes.txt > "$RUNNER_TEMP/release-excludes.zlist"
          chmod 600 "$RUNNER_TEMP/release-files.zlist" "$RUNNER_TEMP/release-excludes.zlist"

      - name: Setup pinned SSH identity
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DRY_RUN_SSH_KEY" > ~/.ssh/dry_run_key
          printf '%s\n' "$DRY_RUN_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/dry_run_key ~/.ssh/known_hosts
          ssh-keygen -F "$DRY_RUN_HOST" -f ~/.ssh/known_hosts >/dev/null
        env:
          DRY_RUN_HOST: ${{ secrets.DRY_RUN_HOST }}
          DRY_RUN_SSH_KEY: ${{ secrets.DRY_RUN_SSH_KEY }}
          DRY_RUN_KNOWN_HOSTS: ${{ secrets.DRY_RUN_KNOWN_HOSTS }}

      - name: Prove immutable release path is absent
        run: |
          ssh -i ~/.ssh/dry_run_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DRY_RUN_USER }}@${{ secrets.DRY_RUN_HOST }}" \
            "test ! -e '${{ secrets.DRY_RUN_TARGET_DIR }}/releases-${{ github.sha }}'"

      - name: Capture rsync dry-run deletion artifact
        run: |
          rsync -avz --delete --dry-run --itemize-changes \
            --chmod=F644,D755 \
            --from0 \
            --files-from="$RUNNER_TEMP/release-files.zlist" \
            --exclude-from="$RUNNER_TEMP/release-excludes.zlist" \
            -e "ssh -i ~/.ssh/dry_run_key -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.DRY_RUN_USER }}@${{ secrets.DRY_RUN_HOST }}:${{ secrets.DRY_RUN_TARGET_DIR }}/releases-${{ github.sha }}/" \
            > rsync-dry-run-${{ github.sha }}.txt

      - name: Upload rsync dry-run evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rsync-dry-run-${{ github.sha }}
          path: rsync-dry-run-${{ github.sha }}.txt
          if-no-files-found: error
          retention-days: 14

  artifact-stage:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.execution_scope == 'artifact-stage-only' || inputs.execution_scope == 'deploy' }}
    name: Stage exact release through private COS
    needs: [provenance, preflight, build-images, remote-dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    environment:
      name: production-artifact-staging
    outputs:
      manifest_sha256: ${{ steps.packet.outputs.manifest_sha256 }}
      receipt_sha256: ${{ steps.transfer.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"

      - name: Download and verify exact reviewed release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          transfer_root="${RUNNER_TEMP}/release-transfer"
          mkdir -m 700 "$transfer_root"
          artifact_zip="${transfer_root}/release-bundle.zip"
          expected_digest='${{ needs.build-images.outputs.release_artifact_digest }}'
          expected_digest="${expected_digest#sha256:}"
          [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --max-redirs 3 \
            --connect-timeout 30 --max-time 1800 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$artifact_zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ needs.build-images.outputs.release_artifact_id }}/zip"
          printf '%s  %s\n' "$expected_digest" "$artifact_zip" | sha256sum -c -
          unzip -q "$artifact_zip" -d "$transfer_root"
          rm -f "$artifact_zip"
          printf 'sha256=%s\n' "$expected_digest" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build exact source bundle and transfer manifest
        id: packet
        shell: bash
        run: |
          set -euo pipefail
          transfer_root="${RUNNER_TEMP}/release-transfer"
          python3 scripts/backup_manifest.py source-create \
            --root . \
            --git-sha "${GITHUB_SHA}" \
            --output "${transfer_root}/source-manifest.v1.json"
          git archive --format=tar "${GITHUB_SHA}" \
            | gzip -n -1 > "${transfer_root}/release-source-${GITHUB_SHA}.tar.gz"
          (
            cd "$transfer_root"
            sha256sum "release-source-${GITHUB_SHA}.tar.gz" \
              > "release-source-${GITHUB_SHA}.tar.gz.sha256"
          )
          created_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          expires_at=$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')
          python3 scripts/release_transfer.py manifest-create \
            --bundle-root "$transfer_root" \
            --source-revision "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-artifact-id "${{ needs.build-images.outputs.release_artifact_id }}" \
            --github-artifact-digest "sha256:${{ steps.artifact.outputs.sha256 }}" \
            --cos-bucket "$COS_BUCKET" \
            --cos-endpoint-host "$COS_ENDPOINT" \
            --created-at "$created_at" \
            --expires-at "$expires_at" \
            --output "${transfer_root}/release-transfer-manifest.v1.json"
          manifest_sha256=$(sha256sum \
            "${transfer_root}/release-transfer-manifest.v1.json" | awk '{print $1}')
          release_bytes=$(python3 - "$transfer_root" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          manifest_path = root / "release-transfer-manifest.v1.json"
          payload = json.loads(manifest_path.read_text())
          print(sum(entry["size_bytes"] for entry in payload["files"]) + manifest_path.stat().st_size)
          PY
          )
          printf 'manifest_sha256=%s\n' "$manifest_sha256" >> "$GITHUB_OUTPUT"
          printf 'release_bytes=%s\n' "$release_bytes" >> "$GITHUB_OUTPUT"
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_ENDPOINT: ${{ vars.COS_ENDPOINT }}

      - name: Upload, probe and stage exact release
        id: transfer
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          transfer_root="${RUNNER_TEMP}/release-transfer"
          ssh_key="${RUNNER_TEMP}/transfer_key"
          known_hosts="${RUNNER_TEMP}/transfer_known_hosts"
          terminal="${transfer_root}/release-transfer-terminal.v1.json"
          probe_object_key="ai-video/probes/${GITHUB_SHA}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/probe.bin"
          probe_mutation_may_exist=0
          remote_state_may_exist=0
          transfer_status=transfer_initialization_failed

          cleanup() {
            status=$?
            trap - EXIT HUP INT TERM
            if [ "$probe_mutation_may_exist" = 1 ]; then
              if env -u TRANSFER_DEADLINE_MONOTONIC_NS \
                python3 scripts/release_transfer.py cos-object-delete \
                --bucket "$COS_BUCKET" \
                --endpoint-host "$COS_ENDPOINT" \
                --object-key "$probe_object_key" \
                >/dev/null 2>&1; then
                probe_mutation_may_exist=0
              else
                transfer_status=cos_probe_cleanup_failed
                status=1
              fi
            fi
            if [ "$status" -ne 0 ] && [ "$remote_state_may_exist" = 1 ] \
              && [ -f "$ssh_key" ] && [ -f "$known_hosts" ]; then
              if ssh -i "$ssh_key" -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$known_hosts" \
                "${TRANSFER_USER}@${TRANSFER_HOST}" \
                "cleanup ${GITHUB_SHA} ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT} ${{ steps.packet.outputs.manifest_sha256 }}" \
                >/dev/null 2>&1; then
                remote_state_may_exist=0
              else
                transfer_status=incoming_cleanup_failed
                status=1
              fi
            fi
            rm -f "$ssh_key" "$known_hosts"
            python3 - "$terminal" "$transfer_status" "$GITHUB_SHA" \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import json
          import os
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          payload = {
              "schema_version": "release-transfer-terminal.v1",
              "status": sys.argv[2],
              "source_revision": sys.argv[3],
              "workflow_run_id": int(sys.argv[4]),
              "workflow_run_attempt": int(sys.argv[5]),
          }
          path.write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n")
          os.chmod(path, 0o600)
          PY
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          for name in COS_SECRET_ID COS_SECRET_KEY COS_SESSION_TOKEN TRANSFER_HOST \
            TRANSFER_USER TRANSFER_SSH_KEY TRANSFER_KNOWN_HOSTS COS_BUCKET \
            COS_ENDPOINT TRANSFER_TARGET_DIR; do
            [ -n "${!name:-}" ] || { printf 'ERROR: transfer_configuration_missing\n' >&2; exit 1; }
          done
          [ "$TRANSFER_TARGET_DIR" = /opt/ai-video ] || {
            printf 'ERROR: transfer_target_root_invalid\n' >&2
            exit 1
          }
          TRANSFER_DEADLINE_MONOTONIC_NS=$(python3 -c \
            'import time; print(time.monotonic_ns() + 1800 * 1_000_000_000)')
          export TRANSFER_DEADLINE_MONOTONIC_NS
          deadline_remaining() {
            python3 -c 'import os,time; remaining=(int(os.environ["TRANSFER_DEADLINE_MONOTONIC_NS"])-time.monotonic_ns())//1_000_000_000; assert 0 < remaining <= 1800; print(remaining)'
          }
          printf '%s\n' "$TRANSFER_SSH_KEY" > "$ssh_key"
          printf '%s\n' "$TRANSFER_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$ssh_key" "$known_hosts"
          ssh-keygen -F "$TRANSFER_HOST" -f "$known_hosts" >/dev/null

          manifest="${transfer_root}/release-transfer-manifest.v1.json"
          transfer_status=cos_versioning_gate_failed
          python3 scripts/release_transfer.py cos-versioning-verify \
            --bucket "$COS_BUCKET" \
            --endpoint-host "$COS_ENDPOINT" >/dev/null

          head -c 67108864 /dev/zero > "${transfer_root}/probe.bin"
          probe_sha=$(sha256sum "${transfer_root}/probe.bin" | awk '{print $1}')
          transfer_status=runner_probe_failed
          probe_mutation_may_exist=1
          python3 scripts/release_transfer.py cos-object-upload \
            --path "${transfer_root}/probe.bin" \
            --bucket "$COS_BUCKET" \
            --endpoint-host "$COS_ENDPOINT" \
            --object-key "$probe_object_key" \
            --sha256 "$probe_sha" \
            --size-bytes 67108864 \
            > "${transfer_root}/runner-probe-upload.json"
          runner_elapsed=$(python3 - "${transfer_root}/runner-probe-upload.json" <<'PY'
          import json
          import pathlib
          import sys
          print(json.loads(pathlib.Path(sys.argv[1]).read_text())["elapsed_nanoseconds"])
          PY
          )
          python3 scripts/release_transfer.py probe-evaluate \
            --transferred-bytes 67108864 \
            --elapsed-nanoseconds "$runner_elapsed" \
            --release-bytes "${{ steps.packet.outputs.release_bytes }}" \
            > "${transfer_root}/runner-probe-receipt.json"
          rm -f "${transfer_root}/probe.bin"

          transfer_status=server_probe_failed
          remote_state_may_exist=1
          probe_deadline_remaining=$(deadline_remaining)
          python3 scripts/release_transfer.py cos-signed-url \
            --bucket "$COS_BUCKET" \
            --endpoint-host "$COS_ENDPOINT" \
            --object-key "$probe_object_key" \
            --validity-seconds 7200 \
            | python3 -c 'import json,sys; print(json.dumps({"schema_version":"release-transfer-probe-url.v1","manifest_sha256":sys.argv[1],"release_bytes":int(sys.argv[2]),"deadline_seconds_remaining":int(sys.argv[3]),"bucket":sys.argv[4],"endpoint_host":sys.argv[5],"url":sys.stdin.read().strip()},sort_keys=True,separators=(",",":")))' \
                "${{ steps.packet.outputs.manifest_sha256 }}" \
                "${{ steps.packet.outputs.release_bytes }}" \
                "$probe_deadline_remaining" \
                "$COS_BUCKET" \
                "$COS_ENDPOINT" \
            | timeout --foreground --signal=TERM --kill-after=5s \
                "${probe_deadline_remaining}s" \
                ssh -i "$ssh_key" -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$known_hosts" \
                "${TRANSFER_USER}@${TRANSFER_HOST}" \
                "probe ${GITHUB_SHA} ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT} ${{ steps.packet.outputs.manifest_sha256 }}" \
                > "${transfer_root}/server-probe-receipt.json"

          upload_plan="${transfer_root}/shared-object-upload-plan.tsv"
          resume_flag=()
          if [ "$RESUME_TRANSFER" = true ]; then
            resume_flag+=(--resume)
          fi
          transfer_status=cos_identity_readback_failed
          python3 scripts/release_transfer.py shared-object-upload-plan \
            --manifest "$manifest" \
            "${resume_flag[@]}" > "$upload_plan"
          transfer_status=cos_release_upload_failed
          while IFS=$'\t' read -r path object_key object_sha object_size; do
            [ -n "$path" ] || continue
            [ "$(stat -c '%s' "${transfer_root}/${path}")" = "$object_size" ]
            [ "$(sha256sum "${transfer_root}/${path}" | awk '{print $1}')" = "$object_sha" ]
            python3 scripts/release_transfer.py cos-object-upload \
              --path "${transfer_root}/${path}" \
              --bucket "$COS_BUCKET" \
              --endpoint-host "$COS_ENDPOINT" \
              --object-key "$object_key" \
              --sha256 "$object_sha" \
              --size-bytes "$object_size" >/dev/null
          done < "$upload_plan"
          transfer_status=cos_identity_readback_failed
          python3 scripts/release_transfer.py shared-object-readback-verify \
            --manifest "$manifest"
          manifest_object_key=$(python3 - "$manifest" <<'PY'
          import json
          import pathlib
          import sys
          print(json.loads(pathlib.Path(sys.argv[1]).read_text())["manifest_object_key"])
          PY
          )
          transfer_status=cos_manifest_upload_failed
          python3 scripts/release_transfer.py cos-object-upload \
            --path "$manifest" \
            --bucket "$COS_BUCKET" \
            --endpoint-host "$COS_ENDPOINT" \
            --object-key "$manifest_object_key" \
            --sha256 "${{ steps.packet.outputs.manifest_sha256 }}" \
            --size-bytes "$(stat -c '%s' "$manifest")" >/dev/null

          transfer_status=incoming_stage_failed
          stage_deadline_remaining=$(deadline_remaining)
          python3 scripts/release_transfer.py signed-url-payload \
            --manifest "$manifest" \
            --validity-seconds 7200 \
            | timeout --foreground --signal=TERM --kill-after=5s \
                "${stage_deadline_remaining}s" \
                ssh -i "$ssh_key" -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$known_hosts" \
                "${TRANSFER_USER}@${TRANSFER_HOST}" \
                "stage ${GITHUB_SHA} ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT} ${{ steps.packet.outputs.manifest_sha256 }}" \
                > "${transfer_root}/release-transfer-receipt.v1.json"
          receipt_deadline_remaining=$(deadline_remaining)
          timeout --foreground --signal=TERM --kill-after=5s \
            "${receipt_deadline_remaining}s" \
            ssh -i "$ssh_key" -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            "${TRANSFER_USER}@${TRANSFER_HOST}" \
            "receipt ${GITHUB_SHA} ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT} ${{ steps.packet.outputs.manifest_sha256 }}" \
            > "${transfer_root}/release-transfer-receipt.readback.v1.json"
          cmp --silent \
            "${transfer_root}/release-transfer-receipt.v1.json" \
            "${transfer_root}/release-transfer-receipt.readback.v1.json"
          deadline_remaining >/dev/null
          receipt_sha256=$(sha256sum \
            "${transfer_root}/release-transfer-receipt.v1.json" | awk '{print $1}')
          printf 'receipt_sha256=%s\n' "$receipt_sha256" >> "$GITHUB_OUTPUT"

          if [ "$EXECUTION_SCOPE" = artifact-stage-only ]; then
            transfer_status=incoming_cleanup_failed
            ssh -i "$ssh_key" -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$known_hosts" \
              "${TRANSFER_USER}@${TRANSFER_HOST}" \
              "cleanup ${GITHUB_SHA} ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT} ${{ steps.packet.outputs.manifest_sha256 }}"
            remote_state_may_exist=0
          fi
          transfer_status=transfer_passed
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          TRANSFER_HOST: ${{ secrets.TRANSFER_HOST }}
          TRANSFER_USER: ${{ secrets.TRANSFER_USER }}
          TRANSFER_SSH_KEY: ${{ secrets.TRANSFER_SSH_KEY }}
          TRANSFER_KNOWN_HOSTS: ${{ secrets.TRANSFER_KNOWN_HOSTS }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_ENDPOINT: ${{ vars.COS_ENDPOINT }}
          TRANSFER_TARGET_DIR: ${{ vars.TRANSFER_TARGET_DIR }}
          RESUME_TRANSFER: ${{ inputs.resume_transfer || false }}
          EXECUTION_SCOPE: ${{ inputs.execution_scope || 'deploy' }}

      - name: Upload bounded transfer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-transfer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/release-transfer/release-transfer-terminal.v1.json
            ${{ runner.temp }}/release-transfer/runner-probe-receipt.json
            ${{ runner.temp }}/release-transfer/server-probe-receipt.json
            ${{ runner.temp }}/release-transfer/release-transfer-receipt.v1.json
            ${{ runner.temp }}/release-transfer/release-transfer-receipt.readback.v1.json

  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.execution_scope == 'deploy' }}
    name: Deploy to Lighthouse
    needs: [preflight, build-images, remote-dry-run, artifact-stage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://video.lute-tlz-dddd.top
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Verify required secrets
        run: |
          missing=0
          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_TARGET_DIR DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_TARGET_DIR: ${{ secrets.DEPLOY_TARGET_DIR }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Setup pinned SSH identity
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Promote verified incoming release
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo /usr/local/sbin/ai-video-release-transfer-gate --production promote ${{ github.sha }} ${{ github.run_id }} ${{ github.run_attempt }} ${{ needs.artifact-stage.outputs.manifest_sha256 }}"

      - name: Trigger remote deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ secrets.DEPLOY_TARGET_DIR }}/releases-${{ github.sha }}/deploy/lighthouse' && AI_VIDEO_SHARED_ROOT='${{ secrets.DEPLOY_TARGET_DIR }}' RELEASE_SOURCE_SHA=${{ github.sha }} RELEASE_IMAGE_ARCHIVE='${{ secrets.DEPLOY_TARGET_DIR }}/releases-${{ github.sha }}/release-images-${{ github.sha }}.tar.gz' RUN_TOKEN_SMOKE=0 RUN_DEPLOY_SMOKE=0 ALLOW_MAINTENANCE_WINDOW=1 bash deploy.sh"

      - name: Smoke test /health
        run: |
          sleep 15
          expected_version=$(python3 scripts/project_version.py --check)
          curl -fsS --max-time 30 "https://video.lute-tlz-dddd.top/api/health" \
            | python3 -c 'import json,sys; payload=json.load(sys.stdin); persistence=payload.get("persistence") or {}; assert payload.get("status")=="ok"; assert payload.get("version")==sys.argv[1]; assert payload.get("source_revision")==sys.argv[2]; assert persistence.get("backend")=="postgresql"; assert persistence.get("status")=="healthy"; assert persistence.get("tables_verified") is True' "$expected_version" "$GITHUB_SHA"

      - name: Log deploy event
        run: |
          printf '%s\n' "::notice::Deployed $GITHUB_SHA to production (reason: ${DEPLOY_REASON})"
        env:
          DEPLOY_REASON: ${{ inputs.reason || 'tag push' }}

  cleanup-staged-release:
    if: ${{ always() && needs.artifact-stage.result != 'skipped' && needs.artifact-stage.outputs.manifest_sha256 != '' && needs.deploy.result != 'success' && (github.event_name != 'workflow_dispatch' || inputs.execution_scope == 'deploy') }}
    name: Cleanup unpromoted staged release
    needs: [artifact-stage, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: production-artifact-staging
    steps:
      - name: Cleanup exact unpromoted incoming release
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cleanup_root="${RUNNER_TEMP}/release-transfer-cleanup"
          mkdir -p "$cleanup_root"
          ssh_key="${cleanup_root}/transfer_key"
          known_hosts="${cleanup_root}/transfer_known_hosts"
          terminal="${cleanup_root}/release-transfer-cleanup-terminal.v1.json"
          cleanup_status=failed

          finish() {
            status=$?
            trap - EXIT
            rm -f "$ssh_key" "$known_hosts"
            if ! python3 - "$terminal" "$cleanup_status" "$GITHUB_SHA" \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
              "${{ needs.artifact-stage.outputs.manifest_sha256 }}" <<'PY'
          import json
          import os
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          payload = {
              "schema_version": "release-transfer-cleanup-terminal.v1",
              "status": sys.argv[2],
              "source_revision": sys.argv[3],
              "workflow_run_id": int(sys.argv[4]),
              "workflow_run_attempt": int(sys.argv[5]),
              "manifest_sha256": sys.argv[6],
          }
          path.write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n")
          os.chmod(path, 0o600)
          PY
            then
              status=1
            fi
            exit "$status"
          }
          trap finish EXIT

          for name in TRANSFER_HOST TRANSFER_USER TRANSFER_SSH_KEY \
            TRANSFER_KNOWN_HOSTS; do
            [ -n "${!name:-}" ] || {
              printf 'ERROR: transfer_cleanup_configuration_missing\n' >&2
              exit 1
            }
          done
          printf '%s\n' "$TRANSFER_SSH_KEY" > "$ssh_key"
          printf '%s\n' "$TRANSFER_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$ssh_key" "$known_hosts"
          ssh-keygen -F "$TRANSFER_HOST" -f "$known_hosts" >/dev/null
          ssh -i "$ssh_key" -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            "${TRANSFER_USER}@${TRANSFER_HOST}" \
            "cleanup ${GITHUB_SHA} ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT} ${{ needs.artifact-stage.outputs.manifest_sha256 }}" \
            >/dev/null
          cleanup_status=passed
        env:
          TRANSFER_HOST: ${{ secrets.TRANSFER_HOST }}
          TRANSFER_USER: ${{ secrets.TRANSFER_USER }}
          TRANSFER_SSH_KEY: ${{ secrets.TRANSFER_SSH_KEY }}
          TRANSFER_KNOWN_HOSTS: ${{ secrets.TRANSFER_KNOWN_HOSTS }}

      - name: Upload staged release cleanup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-transfer-cleanup-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/release-transfer-cleanup/release-transfer-cleanup-terminal.v1.json
