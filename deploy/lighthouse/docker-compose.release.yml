x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

services:
  backend:
    image: lighthouse-backend:${RELEASE_IMAGE_TAG:?RELEASE_IMAGE_TAG is required}
    build:
      context: ../..
      dockerfile: Dockerfile.backend
      args:
        RELEASE_SOURCE_SHA: ${RELEASE_SOURCE_SHA:?RELEASE_SOURCE_SHA is required}
    container_name: ai_video_backend
    restart: on-failure:5
    user: "999:999"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8001"
    env_file:
      - ${AI_VIDEO_ENV_FILE:?AI_VIDEO_ENV_FILE is required}
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - RENDERING_SERVICE_SOCKET=/run/rendering/rendering.sock
      - XDG_DATA_HOME=/usr/share
    volumes:
      - backend_output:/app/output
      - renderer_socket:/run/rendering
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    networks:
      - ai_video_net
    depends_on:
      - rendering
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  rendering:
    image: lighthouse-rendering:${RELEASE_IMAGE_TAG:?RELEASE_IMAGE_TAG is required}
    build:
      context: ../..
      dockerfile: rendering/Dockerfile
      args:
        RELEASE_SOURCE_SHA: ${RELEASE_SOURCE_SHA:?RELEASE_SOURCE_SHA is required}
    container_name: ai_video_rendering
    restart: unless-stopped
    init: true
    network_mode: none
    user: "999:999"
    read_only: true
    cpus: "2.0"
    mem_limit: 4g
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
      - OUTPUT_DIR=/app/output
      - RENDERING_SERVICE_SOCKET=/run/rendering/rendering.sock
      - HOME=/tmp/renderer-home
    volumes:
      - backend_output:/app/output
      - renderer_socket:/run/rendering
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('node:http');const r=h.request({socketPath:'/run/rendering/rendering.sock',path:'/health'},x=>process.exit(x.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.end()"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    logging: *default-logging

  frontend:
    image: lighthouse-frontend:${RELEASE_IMAGE_TAG:?RELEASE_IMAGE_TAG is required}
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        RELEASE_SOURCE_SHA: ${RELEASE_SOURCE_SHA:?RELEASE_SOURCE_SHA is required}
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_IS_DEMO: "false"
        NEXT_PUBLIC_API_KEY: ""
    container_name: ai_video_frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - HOSTNAME=0.0.0.0
    networks:
      - ai_video_net
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

volumes:
  backend_output:
  renderer_socket:

networks:
  ai_video_net:
    driver: bridge

name: lighthouse
